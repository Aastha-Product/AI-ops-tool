    return `<div class="table-wrap"><table><thead><tr><th>Factor</th><th>Input</th><th style="width:28%">Points</th><th>Why</th></tr></thead><tbody>
      ${r.score_breakdown.map((b) => `<tr><td><b style="color:var(--text)">${esc(b.label)}</b></td><td>${esc(b.input)}</td>
      <td><div class="scorecell"><div class="bar"><i style="width:${Math.round(100 * b.points / b.max)}%"></i></div><b>${fmt(b.points)}</b><span class="faint">/${b.max}</span></div></td><td class="wrap">${esc(b.why)}</td></tr>`).join("")}
      <tr><td><b style="color:var(--text)">Total</b></td><td></td><td><b style="color:var(--text)">${fmt(r.score)} / 100</b></td><td class="wrap muted">Tie-break: score, investment ratio, experience, time to open, Application ID.</td></tr></tbody></table></div>`;
  }
  if (S.tab === "competition") {
    if (!r.territory_id) return `<div class="empty">${ic("map")}<div>This pin code is not in any territory, so there is no competition to show.</div></div>`;
    const comp = Object.values(recs).filter((x) => x.territory_id === r.territory_id).sort((a, b) => (a.rank || 999) - (b.rank || 999) || a.app_id.localeCompare(b.app_id));
    const t = S.result.territories.find((x) => x.territory_id === r.territory_id) || {};
    return `<div class="facts" style="margin-bottom:14px"><div class="fact"><div class="f-l">Territory</div><div class="f-v">${esc(r.territory_id)} · ${esc(t.city || "")}</div></div>
      <div class="fact"><div class="f-l">Open slots</div><div class="f-v">${t.slots ?? "–"} (${t.approved ?? 0} filled)</div></div>
      <div class="fact"><div class="f-l">Existing-store pins</div><div class="f-v">${esc(t.existing_store_pins || "none")}</div></div>
      <div class="fact"><div class="f-l">Pins approved</div><div class="f-v">${esc(t.pins_used || "none")}</div></div></div>
      <div class="table-wrap"><table><thead><tr><th>Rank</th><th>Applicant</th><th>Pin</th><th>Score</th><th>Decision</th></tr></thead><tbody>
      ${comp.map((x) => `<tr class="click" data-app="${esc(x.app_id)}" ${x.app_id === r.app_id ? 'style="outline:2px solid var(--brand);outline-offset:-2px"' : ""}><td>${x.rank || "–"}</td>
      <td class="who"><b>${esc(x.app_id)} · ${esc(x.name || "")}</b></td><td class="mono">${esc(x.pin)}</td>
      <td>${x.score == null ? '<span class="faint">not scored</span>' : `<div class="scorecell"><div class="bar"><i style="width:${x.score}%"></i></div><b>${fmt(x.score)}</b></div>`}</td><td>${pill(x.decision)}</td></tr>`).join("")}</tbody></table></div>`;
  }
  if (S.tab === "onboarding" && r.checklist) {
    const ck = r.checklist;
    return `<div class="facts" style="margin-bottom:16px"><div class="fact"><div class="f-l">Planned opening</div><div class="f-v">${esc(ck.planned_opening_text)}</div></div>
      <div class="fact"><div class="f-l">Schedule</div><div class="f-v">${esc(ck.plan.scheduled)}</div></div>
      <div class="fact"><div class="f-l">Space · staff</div><div class="f-v">${esc(ck.space)} · ${ck.staff} staff</div></div>
      <div class="fact"><div class="f-l">Track</div><div class="f-v">${ck.fast_track ? "Fast-track (High priority)" : "Standard onboarding"}</div></div></div>
      ${ck.plan.gap ? `<div class="callout" style="margin-bottom:16px">${ic("clock")}<span>${esc(ck.plan.gap)}</span></div>` : ""}
      <ol class="timeline">${ck.steps.map((s) => `<li class="${s.key === "launch" ? "launch" : ""}"><span class="dot"></span>
        <div class="t-top"><b>${esc(s.name)}</b><span class="t-when">${esc(s.dates)}</span><span class="faint">${esc(s.timing)}</span></div>
        ${s.detail ? `<div class="t-det">${esc(s.detail)}</div>` : ""}<div class="t-done">Done when: ${esc(s.done_when)}</div></li>`).join("")}</ol>`;
  }
  if (S.tab === "training" && r.training) {
    const t = r.training;
    return `<div class="facts" style="margin-bottom:16px"><div class="fact"><div class="f-l">Track</div><div class="f-v">${esc(t.track_label || t.track)}</div></div>
      <div class="fact"><div class="f-l">Language</div><div class="f-v">${esc(t.language)}</div></div>
      <div class="fact"><div class="f-l">Duration</div><div class="f-v">${esc(t.duration_text)}</div></div>
      <div class="fact"><div class="f-l">When</div><div class="f-v">${esc(t.window || "–")}</div></div></div>
      <div class="sec-title">Why this track</div><p style="margin:0 0 12px">${esc(t.why)}. ${esc(t.format)}</p>
      <div class="sec-title">Modules</div><div class="modules">${t.modules.map((m) => `<span class="chip">${esc(m)}</span>`).join("")}</div>
      ${t.shadow_store ? `<div class="sec-title">Shadowing store</div><p style="margin:0">${esc(t.shadow_store.text)}</p>` : ""}
      <div class="sec-title">Store staff</div><p style="margin:0">${esc(t.staff_training)}</p>`;
  }
  if (S.tab === "data") {
    const sg = r.signals || {}, nice = (v) => esc(String(v || "–").replace(/_/g, " "));
    let h = `<div class="grid g-2"><div><div class="sec-title">As uploaded</div><div class="kv">${Object.entries(r.inputs).map(([k, v]) => `<div class="k">${esc(k)}</div><div class="v">${esc(v ?? "–") || "–"}</div>`).join("")}</div></div>
      <div><div class="sec-title">Read from the free text (${esc(sg.source || "")})</div><div class="kv">
        <div class="k">Business type</div><div class="v">${nice(sg.business_type)}</div><div class="k">Funding</div><div class="v">${nice(sg.funding_status)}${sg.funding_evidence ? ` · “${esc(sg.funding_evidence)}”` : ""}</div>
        <div class="k">Space claims</div><div class="v">${nice(sg.space_claims)}${sg.space_evidence ? ` · “${esc(sg.space_evidence)}”` : ""}</div><div class="k">Floor claim</div><div class="v">${nice(sg.floor_claim)}</div>
        <div class="k">Deadline</div><div class="v">${esc(sg.deadline_text || "–")}</div></div>`;
    if (r.required_lakh) {
      const p = r.cost_parts_lakh;
      h += `<div class="sec-title">Cost to open (${esc(r.tier)}, ${fmt(r.size_for_costing)} sq ft${r.size_known ? "" : " assumed"}, ${esc(String(r.costing_space).toLowerCase())})</div><div class="kv">
        <div class="k">Franchise fee</div><div class="v">₹${fmt(p.franchise_fee, 2)} L</div><div class="k">Fit-out</div><div class="v">₹${fmt(p.fitout, 2)} L</div>
        <div class="k">Initial inventory</div><div class="v">₹${fmt(p.inventory, 2)} L</div><div class="k">Working capital</div><div class="v">₹${fmt(p.working_capital, 2)} L</div>
        <div class="k">Rent deposit</div><div class="v">₹${fmt(p.rent_deposit, 2)} L</div><div class="k"><b>Total required</b></div><div class="v"><b>₹${fmt(r.required_lakh)} lakh</b></div></div>`;
    }
    return h + `</div></div>`;
  }
  if (S.tab === "history") {
    const log = logFor(r);
    return log.length ? `<ol class="timeline">${log.map((e) => `<li><span class="dot"></span><div class="t-top"><b>“${esc(e.message)}”</b><span class="t-when">${esc(e.time)}</span></div>
      <div class="t-det">Applied: ${esc(e.updates.join("; "))}</div><div class="t-done">Decision changes: ${esc(e.changes.join(", ") || "none")}</div></li>`).join("")}</ol>`
      : `<div class="empty">${ic("clock")}<div>No chat updates have affected this applicant.</div></div>`;
  }
  return "";
}

// ---------------------------------------------------------------- views: methodology
function viewMethod() {
  if (!META) return `<div class="card card-b">Loading…</div>`;
  const w = META.score_weights, a = META.adequacy, tiers = Object.keys(META.cost_model), totalW = Object.values(w).reduce((x, y) => x + y, 0);
  const labels = { investment_adequacy: "Investment adequacy", retail_experience: "Retail experience", business_background: "Business background", space_quality: "Space quality",
                   territory_priority: "Territory priority", location: "Location & cannibalisation", timeline_fit: "Timeline fit", payback: "Payback" };
  return `<div class="stack">
  <div class="callout">${ic("shield")}<span><b>Rules decide, AI explains.</b> Every decision comes from fixed rules and a score card, so the same input always gives the same output. AI is used only to read messy free text into fixed fields and to phrase answers; without it, keyword rules and templates do the same job.</span></div>
  <div class="grid g-3">
    <div class="card gate"><div class="g-ico ico-On-hold">${ic("table")}</div><b>Gate A · Data</b><p>Missing required fields, invalid pin, city/pin or city/state mismatch, or notes that contradict the form put the applicant <b>On hold</b> with the exact fix.</p></div>
    <div class="card gate"><div class="g-ico ico-Not-approved">${ic("pin")}</div><b>Gate B · Location</b><p>A pin in no territory, or a pin that already has a brand store, is <b>Not approved</b>; other open pins or territories are suggested.</p></div>
    <div class="card gate"><div class="g-ico ico-Waitlisted">${ic("shield")}</div><b>Gate C · Readiness</b><p>Funds under ${Math.round(a.not_approved_below * 100)}% of the store's cost: <b>Not approved</b>. ${Math.round(a.not_approved_below * 100)}–100%, no space, upper floor (non-mall), under ${META.min_size_sqft} sq ft or unconfirmed funding: <b>On hold</b>.</p></div>
  </div>
  <div class="grid g-2">
    <div class="card"><div class="card-h"><h3>Score card</h3><span class="sub">${totalW} points, eligible applicants only</span></div><div class="card-b weights">
      ${Object.entries(w).map(([k, v]) => `<div><span>${labels[k] || k}</span><span class="bar"><i style="width:${100 * v / 25}%"></i></span><b class="num">${v}</b></div>`).join("")}
      <p class="muted" style="margin:10px 0 0;font-size:12.5px">Investment: ratio 1.0 earns ${a.base_points_at_1}, rising to ${w.investment_adequacy} at ${a.full_points_at}×. Location: over 3 km from a brand store earns 15, 1.5–3 km 8, under 1.5 km 0.</p></div></div>
    <div class="card"><div class="card-h"><h3>Allocation and tie-break</h3></div><div class="card-b"><ol class="steps-list">
      <li>Rank eligible applicants within each territory by score.</li><li>Ties: higher investment ratio, then more experience, then shorter time to open, then lower Application ID.</li>
      <li>Walk the ranking: a pin already won goes to the waitlist; once slots are full, the rest are waitlisted.</li><li>Invariants are checked after every run: no two stores in one pin, slots never exceeded.</li></ol></div></div>
  </div>
  <div class="card"><div class="card-h"><h3>Cost to open a store</h3><span class="sub">team assumptions, scaled from public Lenskart figures</span></div>
    <div class="table-wrap"><table><thead><tr><th>Tier</th><th class="num">Franchise fee</th><th class="num">Fit-out / sq ft</th><th class="num">Inventory</th><th class="num">Working capital</th><th class="num">Rent / sq ft / month</th><th class="num">Revenue / sq ft / month</th></tr></thead><tbody>
    ${tiers.map((t) => { const c = META.cost_model[t]; return `<tr><td><b style="color:var(--text)">${t}</b></td><td class="num">₹${fmt(c.franchise_fee / 1e5)} L</td><td class="num">₹${c.fitout_per_sqft.toLocaleString("en-IN")}</td><td class="num">₹${fmt(c.inventory / 1e5)} L</td><td class="num">₹${fmt(c.working_capital / 1e5)} L</td><td class="num">₹${c.rent_per_sqft_month}</td><td class="num">₹${META.revenue_model[t].revenue_per_sqft_month.toLocaleString("en-IN")}</td></tr>`; }).join("")}
    </tbody></table></div>
    <div class="card-b" style="border-top:1px solid var(--border)"><div class="sec-title">Worked examples</div><div class="facts">
      ${META.worked_examples.map((e) => `<div class="fact"><div class="f-l">${e.tier} · ${e.size} sq ft · ${e.space.toLowerCase()}</div><div class="f-v">₹${fmt(e.required_lakh)} lakh</div></div>`).join("")}</div>
      <p class="muted" style="margin:12px 0 0;font-size:12.5px">Rent deposit is ${META.rent_deposit_months} months' rent (rented spaces only). Payback uses a ${Math.round(META.net_margin * 100)}% net margin on revenue.</p></div></div>
  <div class="card"><div class="card-h"><h3>Onboarding and training</h3></div><div class="card-b"><div class="grid g-3">
    <div><div class="sec-title">Checklist</div><p style="margin:0">Nine dated steps from offer to 90-day review, scheduled backwards from the target launch, or forwards from today when the target is unrealistic. High-priority territories are fast-tracked.</p></div>
    <div><div class="sec-title">Training tracks</div><p style="margin:0">0 years: Foundation, 10 days + 2 weeks shadowing. 1–5 years: Standard, 6 days + 1 week. 6+ years: Fast track, 3 days.</p></div>
    <div><div class="sec-title">Language and shadowing</div><p style="margin:0">All modules in the applicant's preferred language, with shadowing at the nearest existing store.</p></div></div>
    <p class="faint" style="margin:14px 0 0;font-size:12px">Distances use Department of Posts pin-code coordinates (data.gov.in, Government Open Data Licence).</p></div></div>
  </div>`;
}

// ---------------------------------------------------------------- render
function render() {
  PK.open = false;
  if (!S.result && VIEWS.find((v) => v.key === S.view)?.needs) S.view = "upload";
  renderShell();
  const fn = { upload: viewUpload, dashboard: viewDashboard, applications: viewApplications, applicant: viewApplicant, method: viewMethod }[S.view];
  $("view").innerHTML = fn();
  renderMsgs(); syncAssistant(); save();
}

// ---------------------------------------------------------------- events
document.addEventListener("click", (ev) => {
  if (PK.open) {
    const pick = ev.target.closest("[data-pick]"), dec = ev.target.closest("[data-pkdec]");
    if (pick) { closePicker(); go("applicant", { selected: pick.dataset.pick }); return; }
    if (dec) { PK.dec = dec.dataset.pkdec; PK.idx = 0; renderPickList(); $("pk-q").focus(); return; }
    if (!ev.target.closest("#picker") || ev.target.closest("#pk-trigger")) { closePicker(); return; }
    return;
  }
  if (ev.target.closest("#pk-trigger")) { openPicker(); return; }
  const t = ev.target.closest("[data-view],[data-app],[data-prompt],[data-action],[data-filter],[data-ter],[data-sort],[data-tab],#drop,#menu,#as-close,#backdrop,#reset,#clear");
  if (!t || t.disabled) return;
  if (t.dataset.view) go(t.dataset.view);
  else if (t.dataset.app) go("applicant", { selected: t.dataset.app });
  else if (t.dataset.prompt) send(t.dataset.prompt);
  else if (t.dataset.filter !== undefined) { S.filters = { dec: t.dataset.filter, ter: S.view === "applications" ? S.filters.ter : "", q: S.view === "applications" ? S.filters.q : "" }; go("applications"); }
  else if (t.dataset.ter) { S.filters = { dec: "", ter: t.dataset.ter, q: "" }; go("applications"); }
  else if (t.dataset.sort) { const k = t.dataset.sort; S.sort = { key: k, dir: S.sort.key === k ? -S.sort.dir : 1 }; render(); }
  else if (t.dataset.tab) { S.tab = t.dataset.tab; render(); }
  else if (t.dataset.action === "sample") loadSample();
  else if (t.dataset.action === "export") downloadExport();
  else if (t.dataset.action === "reset" || t.id === "reset") { ev.preventDefault(); resetToUpload(); }
  else if (t.dataset.action === "assistant") { S.assistant = !S.assistant; closeSide(); syncAssistant(); renderShell(); save(); if (S.assistant) $("chat-input").focus(); }
  else if (t.id === "clear") { ev.preventDefault(); S.messages = []; render(); }
  else if (t.id === "drop") $("file").click();
  else if (t.id === "menu") { $("sidebar").classList.add("open"); $("backdrop").classList.add("on"); }
  else if (t.id === "as-close") { S.assistant = false; syncAssistant(); renderShell(); save(); }
  else if (t.id === "backdrop") { $("sidebar").classList.remove("open"); S.assistant = false; syncAssistant(); renderShell(); save(); }
});
document.addEventListener("keydown", (ev) => {
  if (ev.target.id === "drop" && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); $("file").click(); }
  if (ev.target.id === "chat-input" && ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); $("chat-form").requestSubmit(); }
  if (PK.open && ev.target.id === "pk-q") {
    if (ev.key === "ArrowDown" || ev.key === "ArrowUp") { ev.preventDefault(); PK.idx += ev.key === "ArrowDown" ? 1 : -1; renderPickList(); return; }
    if (ev.key === "Enter") { ev.preventDefault(); const id = PK.items[PK.idx]; closePicker(); if (id) go("applicant", { selected: id }); return; }
    if (ev.key === "Escape") { ev.preventDefault(); closePicker(); $("pk-trigger").focus(); return; }
  }
  if (ev.key === "Escape") { $("sidebar").classList.remove("open"); if (window.innerWidth <= 1280 && S.assistant) { S.assistant = false; syncAssistant(); renderShell(); } }
});
document.addEventListener("change", (ev) => {
  const id = ev.target.id;
  if (id === "file") { loadFile(ev.target.files[0]); ev.target.value = ""; }
  else if (id === "f-ter") { S.filters.ter = ev.target.value; render(); }
});
document.addEventListener("mousemove", (ev) => {
  const t = ev.target.closest && ev.target.closest("[data-tip]"), tip = $("tip");
  if (!t) { tip.style.display = "none"; return; }
  tip.textContent = t.getAttribute("data-tip"); tip.style.display = "block";
  const x = Math.min(ev.clientX + 14, window.innerWidth - tip.offsetWidth - 8);
  tip.style.left = x + "px"; tip.style.top = (ev.clientY - 36) + "px";
});
document.addEventListener("input", (ev) => {
  if (ev.target.id === "gq") {
    S.filters = { dec: "", ter: "", q: ev.target.value }; if (S.view !== "applications") S.view = "applications";
    const pos = ev.target.selectionStart; render(); const el = $("gq"); el.focus(); el.setSelectionRange(pos, pos); return;
  }
  if (ev.target.id === "pk-q") { PK.idx = 0; renderPickList(); return; }
  if (ev.target.id === "f-q") { S.filters.q = ev.target.value; const pos = ev.target.selectionStart; render(); const el = $("f-q"); el.focus(); el.setSelectionRange(pos, pos); }
  if (ev.target.id === "chat-input") { ev.target.style.height = "auto"; ev.target.style.height = Math.min(ev.target.scrollHeight, 120) + "px"; }
});
document.addEventListener("dragover", (ev) => { const d = ev.target.closest("#drop"); if (d) { ev.preventDefault(); d.classList.add("over"); } });
document.addEventListener("dragleave", (ev) => { const d = ev.target.closest("#drop"); if (d) d.classList.remove("over"); });
document.addEventListener("drop", (ev) => { const d = ev.target.closest("#drop"); if (d) { ev.preventDefault(); d.classList.remove("over"); loadFile(ev.dataTransfer.files[0]); } });
$("chat-form").addEventListener("submit", (ev) => { ev.preventDefault(); const el = $("chat-input"); const v = el.value; el.value = ""; el.style.height = "auto"; send(v); });
window.addEventListener("resize", () => syncAssistant());

(async function init() {
  $("brand-mark").innerHTML = ic("store"); $("as-ico").innerHTML = ic("spark"); $("menu").innerHTML = ic("menu");
  $("as-close").innerHTML = ic("x"); $("send").innerHTML = ic("send");
  restore();
  if (window.innerWidth <= 1280) S.assistant = false;  // overlay: start closed on smaller screens
  try { META = await (await api("/api/meta")).json(); } catch (e) { META = { llm_available: false }; }
  render();
})();
</script>
</body>
</html>
