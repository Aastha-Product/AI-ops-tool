<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Franchise Partner Onboarding Engine</title>
<meta name="description" content="Franchise partner acquisition, geo-selection and onboarding decisions.">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* ------------------------------------------------------------------ tokens */
:root {
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
  --bg: #f3f4f8; --surface: #ffffff; --surface-2: #f8f9fc; --surface-3: #eef0f6;
  --border: #e7e9f0; --border-strong: #d4d8e3;
  --text: #0f172a; --text-2: #394155; --muted: #6b7386; --faint: #9aa1b3;
  --brand: #4f46e5; --brand-hover: #4338ca; --brand-soft: #eef0ff; --brand-ink: #ffffff;
  --grad: linear-gradient(135deg, #4f46e5 0%, #7c3aed 55%, #c026d3 100%);
  --grad-dark: linear-gradient(150deg, #1e1b4b 0%, #312e81 50%, #6d28d9 100%);
  /* accent family: indigo · violet · teal · amber · rose · sky */
  --indigo: #4f46e5; --violet: #7c3aed; --teal: #0d9488; --amber: #d97706; --rose: #e11d48; --sky: #0284c7;
  --g-indigo: linear-gradient(135deg, #6366f1, #8b5cf6);
  --g-teal: linear-gradient(135deg, #14b8a6, #0ea5e9);
  --g-amber: linear-gradient(135deg, #f59e0b, #f97316);
  --g-rose: linear-gradient(135deg, #f43f5e, #ec4899);
  --g-green: linear-gradient(135deg, #10b981, #14b8a6);
  --g-sky: linear-gradient(135deg, #0ea5e9, #6366f1);
  --page-glow: radial-gradient(900px 480px at -5% -10%, rgba(99,102,241,.13), transparent 60%),
               radial-gradient(800px 460px at 105% 0%, rgba(20,184,166,.11), transparent 60%),
               radial-gradient(700px 420px at 60% 110%, rgba(244,63,94,.07), transparent 60%);
  --side-bg: #ffffff; --side-text: #4b5468; --side-hover: #f3f4f8; --side-active: #eef0ff; --side-active-text: #4338ca;
  /* chart marks: validated with the dataviz palette checker (light surface #ffffff) */
  --c-ok: #12a15e; --c-wait: #c27a0a; --c-hold: #2e7fe0; --c-no: #d92d20;
  --ok: #067647; --ok-bg: #ecfdf3; --ok-bd: #abefc6;
  --wait: #b54708; --wait-bg: #fffaeb; --wait-bd: #fedf89;
  --hold: #175cd3; --hold-bg: #eff8ff; --hold-bd: #b2ddff;
  --no: #b42318; --no-bg: #fef3f2; --no-bd: #fecdca;
  --shadow-sm: 0 1px 2px rgba(16,24,40,.04);
  --shadow: 0 1px 2px rgba(16,24,40,.04), 0 6px 20px rgba(16,24,40,.05);
  --shadow-lg: 0 20px 48px rgba(15,23,42,.18);
  --radius: 16px; --radius-sm: 10px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b0f1a; --surface: #121829; --surface-2: #161d31; --surface-3: #1d2540;
    --border: #232b44; --border-strong: #323c5c;
    --text: #e8ebf4; --text-2: #c2c8d8; --muted: #8b93a9; --faint: #646d86;
    --brand: #8b8cf8; --brand-hover: #a5a6ff; --brand-soft: #1f2350; --brand-ink: #0b0f1a;
    --grad: linear-gradient(135deg, #5b5bf0 0%, #8b5cf6 55%, #d946ef 100%);
    --indigo: #818cf8; --violet: #a78bfa; --teal: #2dd4bf; --amber: #fbbf24; --rose: #fb7185; --sky: #38bdf8;
    --page-glow: radial-gradient(900px 480px at -5% -10%, rgba(99,102,241,.22), transparent 60%),
                 radial-gradient(800px 460px at 105% 0%, rgba(20,184,166,.16), transparent 60%),
                 radial-gradient(700px 420px at 60% 110%, rgba(244,63,94,.10), transparent 60%);
    --side-bg: #0f1424; --side-text: #9aa3bb; --side-hover: rgba(255,255,255,.04); --side-active: #1f2350; --side-active-text: #c7c9ff;
    /* validated against the dark chart surface #141b2d */
    --c-ok: #22a868; --c-wait: #c98315; --c-hold: #3b8fe0; --c-no: #e5574b;
    --ok: #75e0a7; --ok-bg: #0b2a1c; --ok-bd: #155d3b;
    --wait: #fdb022; --wait-bg: #2e1f05; --wait-bd: #6b4709;
    --hold: #84caff; --hold-bg: #0b2240; --hold-bd: #1d4f8c;
    --no: #fda29b; --no-bg: #36110d; --no-bd: #7a271a;
    --shadow-sm: none; --shadow: none; --shadow-lg: 0 20px 48px rgba(0,0,0,.55);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--page-glow), var(--bg); background-attachment: fixed; color: var(--text); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--brand); text-decoration: none; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--mono); font-size: .86em; letter-spacing: -.01em; }
.muted { color: var(--muted); } .faint { color: var(--faint); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ------------------------------------------------------------------ shell */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr) auto; min-height: 100vh; }
.sidebar { background: var(--side-bg); color: var(--side-text); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; padding: 18px 14px; z-index: 30; border-right: 1px solid var(--border); overflow-y: auto; }
.brand { display: flex; gap: 10px; align-items: center; padding: 4px 6px 18px; color: var(--text); }
.brand-mark { width: 36px; height: 36px; border-radius: 11px; background: var(--grad); display: grid; place-items: center; box-shadow: 0 6px 16px rgba(79,70,229,.35); }
.brand-mark svg.i { width: 18px; height: 18px; stroke: #fff; }
.brand b { display: block; font-size: 14px; letter-spacing: -.01em; }
.brand span { font-size: 11.5px; color: var(--muted); }
.nav-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); padding: 14px 10px 6px; font-weight: 600; }
.nav button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; margin: 1px 0; border: 0; background: none; color: var(--side-text); border-radius: 10px; cursor: pointer; text-align: left; font-weight: 500; }
.nav button:hover { background: var(--side-hover); color: var(--text); }
.nav button svg.i { color: var(--nc, currentColor); }
.nav button.active { background: color-mix(in srgb, var(--nc, var(--indigo)) 14%, transparent); color: var(--text); font-weight: 650; box-shadow: inset 3px 0 0 var(--nc, var(--indigo)); }
.nav button:disabled { opacity: .4; cursor: default; background: none; }
.nav .count { margin-left: auto; font-size: 11.5px; background: var(--surface-3); color: var(--text-2); padding: 0 8px; border-radius: 999px; font-weight: 600; }
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 12px 28px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); min-height: 64px; }
.topbar h1 { font-size: 18px; margin: 0; letter-spacing: -.015em; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 340px; }
.crumbs { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 280px; }
.top-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.progress { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; overflow: hidden; display: none; }
.progress.on { display: block; }
.progress::after { content: ""; position: absolute; inset: 0; width: 35%; background: var(--brand); animation: slide 1s ease-in-out infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
.content { padding: 24px 28px 48px; max-width: 1360px; width: 100%; }
.btn.menu-btn { display: none; }

/* ------------------------------------------------------------------ primitives */
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-2); font-weight: 550; cursor: pointer; white-space: nowrap; box-shadow: var(--shadow-sm); transition: background .12s, border-color .12s; }
.btn:hover { background: var(--surface-2); border-color: var(--faint); }
.btn.primary { background: var(--g-indigo); border-color: transparent; color: #fff; box-shadow: 0 6px 16px rgba(99,102,241,.28); }
.btn.primary:hover { filter: brightness(1.08); background: var(--g-indigo); border-color: transparent; }
.btn.ghost { border-color: transparent; background: none; box-shadow: none; }
.btn.ghost:hover { background: var(--surface-3); }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.btn.icon { padding: 7px; }
.btn:disabled { opacity: .5; cursor: default; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-size: 12.5px; color: var(--text-2); white-space: nowrap; }
.chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
.chip.live .dot { background: #12b76a; box-shadow: 0 0 0 3px rgba(18,183,106,.18); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-h { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.card-h h2, .card-h h3 { margin: 0; font-size: 14.5px; font-weight: 650; letter-spacing: -.01em; }
.card-h .sub { color: var(--muted); font-size: 12.5px; }
.card-h .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.card-b { padding: 16px 18px; }
.grid { display: grid; gap: 16px; }
.g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-main { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
.stack > * + * { margin-top: 16px; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px 2px 7px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid; white-space: nowrap; line-height: 1.5; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.lg { font-size: 13px; padding: 4px 12px 4px 10px; }
.p-Approved { color: var(--ok); background: var(--ok-bg); border-color: var(--ok-bd); }
.p-Waitlisted { color: var(--wait); background: var(--wait-bg); border-color: var(--wait-bd); }
.p-On-hold { color: var(--hold); background: var(--hold-bg); border-color: var(--hold-bd); }
.p-Not-approved { color: var(--no); background: var(--no-bg); border-color: var(--no-bd); }
.tag { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 7px; border-radius: 6px; background: var(--surface-3); color: var(--text-2); }
.tag.High { background: var(--no-bg); color: var(--no); } .tag.Medium { background: var(--wait-bg); color: var(--wait); } .tag.Low { background: var(--surface-3); color: var(--muted); }
.bar { height: 6px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 999px; background: var(--brand); }
.empty { text-align: center; padding: 40px 20px; color: var(--muted); }
.empty svg.i { width: 28px; height: 28px; color: var(--faint); margin-bottom: 8px; }
select.input, input.input { height: 34px; padding: 0 10px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); }
.search { position: relative; } .search svg.i { position: absolute; left: 10px; top: 9px; color: var(--faint); } .search input { padding-left: 32px; width: 240px; }

/* ------------------------------------------------------------------ dashboard */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; margin-bottom: 16px; }
.kpi { padding: 16px 18px; cursor: pointer; transition: border-color .12s, transform .12s, box-shadow .12s; text-align: left; position: relative; color: var(--text); font: inherit; }
.kpi:hover { transform: translateY(-1px); }
.kpi:hover { border-color: var(--border-strong); }
.kpi .k-top { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .k-ico { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; }
.kpi .k-val { font-size: 28px; font-weight: 700; letter-spacing: -.02em; margin-top: 8px; line-height: 1.1; }
.kpi .k-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.ico-all { background: var(--brand-soft); color: var(--brand); } .ico-Approved { background: var(--ok-bg); color: var(--ok); }
.ico-Waitlisted { background: var(--wait-bg); color: var(--wait); } .ico-On-hold { background: var(--hold-bg); color: var(--hold); } .ico-Not-approved { background: var(--no-bg); color: var(--no); }
.mix { display: flex; height: 12px; border-radius: 999px; overflow: hidden; background: var(--surface-3); gap: 2px; }
.mix i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; font-size: 12.5px; color: var(--text-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; } .legend b { font-weight: 650; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.bg-Approved { background: #17b26a; } .bg-Waitlisted { background: #f79009; } .bg-On-hold { background: #2e90fa; } .bg-Not-approved { background: #f04438; }
.ters { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.ter { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; background: var(--surface-2); cursor: pointer; transition: border-color .12s; }
.ter:hover { border-color: var(--border-strong); }
.ter .t-h { display: flex; align-items: center; gap: 8px; } .ter .t-h b { font-size: 13.5px; }
.ter .t-city { color: var(--muted); font-size: 12.5px; margin: 2px 0 10px; }
.ter .t-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 8px; }
.ter .t-slots { font-size: 12.5px; font-weight: 600; color: var(--text-2); display: flex; justify-content: space-between; margin-bottom: 6px; }
.todo { list-style: none; margin: 0; padding: 0; }
.todo li { display: flex; gap: 10px; padding: 11px 18px; border-top: 1px solid var(--border); cursor: pointer; }
.todo li:first-child { border-top: 0; } .todo li:hover { background: var(--surface-2); }
.todo .t-id { font-weight: 600; } .todo .t-fix { color: var(--text-2); font-size: 13px; }
.todo .t-ico { color: var(--hold); margin-top: 2px; }

/* ------------------------------------------------------------------ table */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.seg { display: inline-flex; background: var(--surface-3); border-radius: 9px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 5px 11px; border-radius: 7px; cursor: pointer; color: var(--muted); font-weight: 550; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
.seg .n { font-size: 11.5px; color: var(--faint); font-weight: 600; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
th { position: sticky; top: 0; background: var(--surface-2); color: var(--muted); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
th.sort { cursor: pointer; user-select: none; } th.sort:hover { color: var(--text); }
th .arr { opacity: .35; margin-left: 3px; } th.sorted .arr { opacity: 1; color: var(--brand); }
td { padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; white-space: nowrap; color: var(--text-2); }
tbody tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--surface-2); }
.num { text-align: right; font-variant-numeric: tabular-nums; }
td.wrap { white-space: normal; min-width: 220px; max-width: 420px; }
.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.who b { color: var(--text); font-weight: 600; display: block; } .who span { font-size: 12px; color: var(--muted); }
.scorecell { display: flex; align-items: center; gap: 8px; min-width: 110px; } .scorecell .bar { flex: 1; min-width: 48px; } .scorecell b { width: 34px; text-align: right; color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.money b { color: var(--text); font-weight: 600; } .money span { font-size: 12px; color: var(--muted); }
.ratio-ok { color: var(--ok); } .ratio-low { color: var(--no); } .ratio-mid { color: var(--wait); }
.tfoot { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-top: 1px solid var(--border); color: var(--muted); font-size: 12.5px; }

/* ------------------------------------------------------------------ applicant */
.profile { display: flex; gap: 16px; align-items: flex-start; padding: 20px; }
.avatar { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; font-weight: 700; font-size: 18px; color: #fff; flex: none; }
.profile h2 { margin: 0; font-size: 20px; letter-spacing: -.015em; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.profile .meta { color: var(--muted); font-size: 13px; margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.profile .meta span { display: inline-flex; align-items: center; gap: 5px; }
.headline { margin-top: 10px; font-size: 14px; color: var(--text); font-weight: 500; }
.p-nav { margin-left: auto; display: flex; gap: 6px; }
.metrics { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid var(--border); }
.metric { padding: 14px 20px; border-left: 1px solid var(--border); } .metric:first-child { border-left: 0; }
.metric .m-l { font-size: 12px; color: var(--muted); font-weight: 550; }
.metric .m-v { font-size: 19px; font-weight: 700; letter-spacing: -.015em; margin-top: 2px; }
.metric .m-s { font-size: 12px; color: var(--muted); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); padding: 0 12px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { border: 0; background: none; padding: 12px 10px; cursor: pointer; color: var(--muted); font-weight: 550; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button:hover { color: var(--text); } .tabs button.on { color: var(--brand); border-bottom-color: var(--brand); }
.reasons { list-style: none; margin: 0; padding: 0; }
.reasons li { display: flex; gap: 10px; padding: 10px 12px; border-radius: 9px; margin-bottom: 6px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); }
.reasons li svg.i { margin-top: 2px; }
.r-blocking { border-color: var(--no-bd) !important; background: var(--no-bg) !important; } .r-blocking svg.i { color: var(--no); }
.r-decision svg.i { color: var(--brand); } .r-warning svg.i { color: var(--wait); } .r-info svg.i { color: var(--muted); }
.sec-title { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 650; margin: 18px 0 8px; }
.sec-title:first-child { margin-top: 0; }
.steps-list { margin: 0; padding: 0; list-style: none; counter-reset: s; }
.steps-list li { position: relative; padding: 0 0 12px 34px; color: var(--text-2); }
.steps-list li::before { counter-increment: s; content: counter(s); position: absolute; left: 0; top: 0; width: 22px; height: 22px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); font-size: 12px; font-weight: 700; display: grid; place-items: center; }
.callout { display: flex; gap: 10px; padding: 12px 14px; border-radius: 10px; background: var(--brand-soft); color: var(--text); font-size: 13.5px; }
.callout svg.i { color: var(--brand); margin-top: 2px; }
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { position: relative; padding: 0 0 18px 30px; }
.timeline li::before { content: ""; position: absolute; left: 7px; top: 18px; bottom: -2px; width: 2px; background: var(--border); }
.timeline li:last-child::before { display: none; }
.timeline .dot { position: absolute; left: 0; top: 3px; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--brand); background: var(--surface); }
.timeline li.launch .dot { background: var(--brand); }
.timeline .t-top { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; }
.timeline .t-top b { color: var(--text); font-weight: 600; }
.timeline .t-when { font-size: 12.5px; color: var(--brand); font-weight: 600; }
.timeline .t-det { font-size: 13px; color: var(--text-2); margin-top: 2px; }
.timeline .t-done { font-size: 12px; color: var(--muted); }
.kv { display: grid; grid-template-columns: 200px 1fr; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.kv div { padding: 9px 12px; border-bottom: 1px solid var(--border); } .kv div:nth-last-child(-n+2) { border-bottom: 0; }
.kv .k { background: var(--surface-2); color: var(--muted); font-weight: 550; font-size: 12.5px; } .kv .v { color: var(--text); }
.modules { display: flex; flex-wrap: wrap; gap: 6px; }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.fact { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; background: var(--surface-2); }
.fact .f-l { font-size: 12px; color: var(--muted); } .fact .f-v { font-weight: 650; color: var(--text); margin-top: 1px; }

/* ------------------------------------------------------------------ upload / method */
.hero { padding: 28px; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px; align-items: center; }
.hero h2 { font-size: 22px; margin: 0 0 6px; letter-spacing: -.02em; }
.hero p { margin: 0 0 18px; color: var(--muted); }
.drop { border: 1.5px dashed var(--border-strong); border-radius: 14px; padding: 30px 20px; text-align: center; cursor: pointer; background: var(--surface-2); transition: border-color .12s, background .12s; }
.drop:hover, .drop.over { border-color: var(--brand); background: var(--brand-soft); }
.drop .d-ico { width: 50px; height: 50px; margin: 0 auto 10px; border-radius: 14px; background: var(--g-teal); color: #fff; display: grid; place-items: center; box-shadow: 0 8px 20px rgba(20,184,166,.3); }
.drop .d-ico svg.i { width: 22px; height: 22px; }
.drop b { display: block; color: var(--text); } .drop span { font-size: 12.5px; color: var(--muted); }
.how { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.how .card { padding: 16px; } .how .n { width: 28px; height: 28px; border-radius: 9px; background: var(--g-indigo); color: #fff; font-weight: 700; display: grid; place-items: center; margin-bottom: 10px; font-size: 13px; }
.how .card:nth-child(2) .n { background: var(--g-teal); } .how .card:nth-child(3) .n { background: var(--g-amber); }
.how b { display: block; margin-bottom: 3px; } .how p { margin: 0; color: var(--muted); font-size: 13px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; }
.stats div { padding: 14px 18px; border-left: 1px solid var(--border); } .stats div:first-child { border-left: 0; }
.stats b { display: block; font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
.stats div:nth-child(1) b { color: var(--indigo); } .stats div:nth-child(2) b { color: var(--teal); } .stats div:nth-child(3) b { color: var(--amber); } .stats div:nth-child(4) b { color: var(--rose); } .stats span { font-size: 12.5px; color: var(--muted); }
.gate { padding: 16px; } .gate .g-ico { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; margin-bottom: 10px; }
.gate b { display: block; margin-bottom: 4px; } .gate p { margin: 0; color: var(--text-2); font-size: 13px; }
.weights div { display: grid; grid-template-columns: 210px 1fr 44px; gap: 12px; align-items: center; padding: 7px 0; font-size: 13px; }
.weights .bar > i { background: var(--brand); }

/* ------------------------------------------------------------------ assistant */
.assistant { width: 392px; border-left: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow: hidden; z-index: 25; }
.assistant.closed { display: none; }
.as-h { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
.as-ico { width: 32px; height: 32px; border-radius: 10px; background: var(--grad); display: grid; place-items: center; color: #fff; }
.as-ico svg.i { stroke: #fff; }
.as-h b { display: block; font-size: 14px; } .as-h span { font-size: 12px; color: var(--muted); }
.as-h .right { margin-left: auto; display: flex; gap: 4px; }
.switch { position: relative; width: 32px; height: 18px; flex: none; }
.switch input { opacity: 0; width: 100%; height: 100%; position: absolute; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--border-strong); transition: background .15s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: var(--shadow-sm); }
.switch input:checked + span { background: var(--brand); } .switch input:checked + span::after { transform: translateX(14px); }
.switch input:disabled + span { opacity: .5; }
.msgs { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 92%; font-size: 13.5px; line-height: 1.55; }
.msg.m-user { align-self: flex-end; background: var(--g-indigo); color: #fff; padding: 9px 13px; border-radius: 14px 14px 4px 14px; }
.msg.m-assistant { align-self: flex-start; background: var(--surface-2); border: 1px solid var(--border); padding: 10px 13px; border-radius: 14px 14px 14px 4px; color: var(--text-2); }
.msg.m-assistant b { color: var(--text); }
.msg p { margin: 0 0 6px; } .msg p:last-child { margin: 0; } .msg ul { margin: 4px 0 6px; padding-left: 18px; }
.welcome { text-align: center; padding: 18px 6px 4px; }
.welcome .as-ico { width: 44px; height: 44px; margin: 0 auto 10px; border-radius: 12px; }
.welcome b { display: block; font-size: 15px; color: var(--text); } .welcome p { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
.sugg { padding: 0 16px 10px; display: flex; flex-direction: column; gap: 6px; }
.sugg-title { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); font-weight: 650; }
.sugg button { text-align: left; border: 1px solid var(--border); background: var(--surface); border-radius: 9px; padding: 7px 11px; cursor: pointer; color: var(--text-2); font-size: 13px; display: flex; gap: 8px; align-items: center; }
.sugg button:hover { border-color: var(--brand); color: var(--text); }
.sugg button svg.i { color: var(--faint); }
.sugg.compact { flex-direction: row; flex-wrap: wrap; padding-bottom: 10px; }
.sugg.compact button { white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; border-radius: 999px; padding: 4px 11px; font-size: 12.5px; }
.composer { border-top: 1px solid var(--border); padding: 12px 16px 14px; }
.composer form { display: flex; gap: 8px; align-items: flex-end; border: 1px solid var(--border-strong); border-radius: 12px; padding: 6px 6px 6px 12px; background: var(--surface); }
.composer form:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.composer textarea { flex: 1; border: 0; outline: 0; resize: none; background: none; padding: 6px 0; max-height: 120px; min-height: 22px; line-height: 1.45; }
.composer .foot { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; font-size: 12px; color: var(--faint); }
.typing { display: inline-flex; gap: 4px; padding: 4px 2px; } .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.backdrop { display: none; }
.toast { position: fixed; top: 76px; left: 50%; transform: translateX(-50%); background: #1d2939; color: #fff; padding: 10px 16px; border-radius: 10px; box-shadow: var(--shadow-lg); z-index: 60; font-size: 13.5px; display: none; max-width: 90vw; }
.toast.err { background: #b42318; } .toast.on { display: block; }

/* ------------------------------------------------------------------ v3 visuals */
.side-note { margin-top: auto; font-size: 11.5px; color: var(--faint); padding: 12px 6px 0; line-height: 1.45; border-top: 1px solid var(--border); }
.gsearch { position: relative; flex: 0 1 320px; margin-left: 16px; }
.gsearch svg.i { position: absolute; left: 13px; top: 11px; color: var(--faint); }
.gsearch input { width: 100%; height: 38px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); padding: 0 14px 0 37px; color: var(--text); }
.gsearch input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.me { display: flex; align-items: center; gap: 9px; padding-left: 6px; }
.me .av { width: 34px; height: 34px; border-radius: 50%; background: var(--grad); color: #fff; font-weight: 700; font-size: 12px; display: grid; place-items: center; }
.me b { display: block; font-size: 13px; line-height: 1.2; } .me span { font-size: 11.5px; color: var(--muted); }
.greet { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.greet h2 { margin: 0; font-size: 26px; letter-spacing: -.025em; font-weight: 700; }
.greet h2 .hl { background: linear-gradient(90deg, var(--indigo), var(--violet) 45%, var(--teal)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.greet p { margin: 4px 0 0; color: var(--muted); }
.greet .acts { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.kpi.kpi-hero { background: var(--grad); border-color: transparent; color: #fff; box-shadow: 0 12px 30px rgba(79,70,229,.30); }
.kpi.kpi-hero .k-top, .kpi.kpi-hero .k-sub { color: rgba(255,255,255,.86); }
.kpi.kpi-hero .k-ico { background: rgba(255,255,255,.18); color: #fff; }
.kpi .k-go { position: absolute; top: 14px; right: 14px; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border); display: grid; place-items: center; color: var(--muted); background: var(--surface); }
.kpi.kpi-hero .k-go { border-color: rgba(255,255,255,.4); color: #fff; background: rgba(255,255,255,.08); }
.kpi .k-go svg.i { width: 14px; height: 14px; transform: rotate(-45deg); }
.kpi .k-top { padding-right: 34px; }
.kpi .k-sub .up { display: inline-block; padding: 0 6px; border-radius: 6px; background: var(--surface-3); color: var(--text-2); font-weight: 650; margin-right: 4px; }
.kpi.kpi-hero .k-sub .up { background: rgba(255,255,255,.2); color: #fff; }
.g-chart { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.chart-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--text-2); }
.chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
.chart-legend i, .donut-list i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.c-Approved { background: var(--c-ok); } .c-Waitlisted { background: var(--c-wait); } .c-On-hold { background: var(--c-hold); } .c-Not-approved { background: var(--c-no); }
svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
svg.chart text { font-family: var(--font); fill: var(--muted); font-size: 11px; }
svg.chart text.lbl { fill: var(--text-2); font-weight: 600; font-size: 11.5px; }
svg.chart .grid { stroke: var(--border); stroke-width: 1; }
svg.chart [data-tip] { cursor: pointer; transition: opacity .12s; }
svg.chart:hover [data-tip] { opacity: .5; } svg.chart [data-tip]:hover { opacity: 1; }
.gauge { position: relative; max-width: 260px; margin: 6px auto 0; }
.gauge-num { position: absolute; left: 0; right: 0; bottom: 6px; text-align: center; }
.gauge-num b { font-size: 30px; letter-spacing: -.02em; display: block; line-height: 1.1; color: var(--text); }
.gauge-num span { font-size: 12.5px; color: var(--muted); }
.gauge-legend { display: flex; justify-content: center; gap: 16px; margin-top: 12px; font-size: 12.5px; color: var(--text-2); }
.gauge-legend span { display: inline-flex; align-items: center; gap: 6px; }
.gauge-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.donut-wrap { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.donut-wrap svg { width: 148px; height: 148px; flex: none; }
.donut-list { flex: 1; min-width: 160px; list-style: none; margin: 0; padding: 0; }
.donut-list li { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px dashed var(--border); font-size: 13px; cursor: pointer; color: var(--text-2); }
.donut-list li:last-child { border-bottom: 0; } .donut-list li:hover { color: var(--text); }
.donut-list b { margin-left: auto; color: var(--text); } .donut-list .pc { width: 40px; text-align: right; color: var(--muted); font-size: 12px; }
.mini-av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 11px; flex: none; }
.who-row { display: flex; align-items: center; gap: 10px; }
.tip { position: fixed; z-index: 70; pointer-events: none; background: #0f172a; color: #fff; font-size: 12.5px; padding: 6px 10px; border-radius: 8px; box-shadow: var(--shadow-lg); white-space: nowrap; display: none; }
.cover { height: 84px; background: linear-gradient(120deg, #4f46e5 0%, #7c3aed 45%, #0ea5e9 80%, #14b8a6 100%); border-radius: var(--radius) var(--radius) 0 0; position: relative; overflow: hidden; }
.cover::before { content: ""; position: absolute; right: 60px; top: -70px; width: 230px; height: 230px; border-radius: 50%; background: rgba(255,255,255,.09); }
.cover::after { content: ""; position: absolute; right: -40px; top: 10px; width: 160px; height: 160px; border-radius: 50%; background: rgba(255,255,255,.07); }
.profile.with-cover { padding-top: 0; position: relative; z-index: 1; }
.profile.with-cover .avatar { margin-top: -30px; border: 4px solid var(--surface); width: 68px; height: 68px; border-radius: 20px; font-size: 22px; box-shadow: var(--shadow); }
.profile.with-cover .p-body { padding-top: 12px; min-width: 0; flex: 1; }
.ring { width: 96px; height: 96px; flex: none; margin-top: -34px; background: var(--surface); border-radius: 50%; padding: 4px; box-shadow: var(--shadow); }
.ring svg { width: 100%; height: 100%; display: block; }
.p-side { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }


/* ------------------------------------------------------------------ v4 colour accents */
.kpi { overflow: hidden; }
.kpi::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--kg, transparent); }
.kpi.k-Approved { --kg: var(--g-green); --kt: #10b981; } .kpi.k-Waitlisted { --kg: var(--g-amber); --kt: #f59e0b; }
.kpi.k-On-hold { --kg: var(--g-sky); --kt: #0ea5e9; } .kpi.k-Not-approved { --kg: var(--g-rose); --kt: #f43f5e; }
.kpi[class*="k-"]:not(.kpi-hero) { background: linear-gradient(180deg, color-mix(in srgb, var(--kt) 9%, var(--surface)), var(--surface) 75%); }
.kpi[class*="k-"]:not(.kpi-hero) .k-ico { background: var(--kg); color: #fff; box-shadow: 0 6px 14px color-mix(in srgb, var(--kt) 35%, transparent); }
.kpi[class*="k-"]:not(.kpi-hero) .k-val { color: var(--text); }
.kpi[class*="k-"]:not(.kpi-hero) .k-sub .up { background: color-mix(in srgb, var(--kt) 16%, transparent); color: var(--text); }
.kpi.kpi-hero::after { content: ""; position: absolute; right: -40px; bottom: -50px; width: 150px; height: 150px; border-radius: 50%; background: rgba(255,255,255,.10); }
.ter { position: relative; overflow: hidden; }
.ter::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--tg, var(--g-indigo)); }
.ter.p-High { --tg: var(--g-rose); } .ter.p-Medium { --tg: var(--g-amber); } .ter.p-Low { --tg: var(--g-teal); }
.ter .bar > i { background: var(--tg, var(--g-indigo)); }
.as-ico { background: linear-gradient(135deg, #14b8a6, #6366f1 60%, #8b5cf6); }
.chip.live .dot { background: var(--teal); }
.me .av { background: linear-gradient(135deg, #f59e0b, #f43f5e); }
.brand-mark { background: linear-gradient(135deg, #6366f1, #8b5cf6 50%, #14b8a6); }
.tabs button.on { color: var(--indigo); border-bottom-color: transparent; background-image: linear-gradient(90deg, var(--indigo), var(--teal)); background-size: 100% 2px; background-position: bottom; background-repeat: no-repeat; }
.timeline .dot { border-color: var(--teal); } .timeline li.launch .dot { background: var(--g-amber); border-color: #f59e0b; }
.steps-list li::before { background: var(--g-indigo); color: #fff; }
.callout { background: linear-gradient(135deg, color-mix(in srgb, #6366f1 12%, var(--surface)), color-mix(in srgb, #14b8a6 10%, var(--surface))); }
.sugg button:hover { border-color: var(--teal); }
.composer form:focus-within { border-color: var(--teal); box-shadow: 0 0 0 3px color-mix(in srgb, #14b8a6 20%, transparent); }


/* ------------------------------------------------------------------ applicant picker */
.picker { position: relative; }
.pk-trigger { display: flex; align-items: center; gap: 10px; width: 360px; max-width: 100%; padding: 6px 12px 6px 6px; border-radius: 12px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); cursor: pointer; box-shadow: var(--shadow-sm); font: inherit; text-align: left; transition: border-color .12s, box-shadow .12s; }
.pk-trigger:hover, .picker.open .pk-trigger { border-color: var(--indigo); box-shadow: 0 0 0 3px color-mix(in srgb, var(--indigo) 18%, transparent); }
.pk-main { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; flex: 1; }
.pk-main b { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
.pk-main span { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pk-chev { color: var(--muted); transition: transform .15s; }
.picker.open .pk-chev { transform: rotate(180deg); }
.pk-pop { position: absolute; top: calc(100% + 8px); left: 0; width: min(460px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-lg); z-index: 40; overflow: hidden; animation: pk-in .12s ease-out; }
@keyframes pk-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.pk-search { position: relative; padding: 10px; border-bottom: 1px solid var(--border); }
.pk-search svg.i { position: absolute; left: 22px; top: 21px; color: var(--faint); }
.pk-search input { width: 100%; height: 38px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); padding: 0 12px 0 34px; color: var(--text); }
.pk-search input:focus { outline: none; border-color: var(--indigo); box-shadow: 0 0 0 3px color-mix(in srgb, var(--indigo) 16%, transparent); }
.pk-chips { display: flex; gap: 6px; padding: 8px 10px 0; flex-wrap: wrap; }
.pk-chips button { border: 1px solid var(--border); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 2px 10px; font: inherit; font-size: 12px; cursor: pointer; }
.pk-chips button.on { background: color-mix(in srgb, var(--indigo) 14%, transparent); border-color: color-mix(in srgb, var(--indigo) 40%, transparent); color: var(--text); font-weight: 600; }
.pk-list { list-style: none; margin: 0; padding: 6px; max-height: 340px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
.pk-list li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; cursor: pointer; }
.pk-list li.hi { background: var(--surface-3); }
.pk-list li.cur .pk-main b { color: var(--indigo); }
.pk-tick { color: var(--indigo); }
.pk-list li.pk-empty { color: var(--muted); justify-content: center; cursor: default; padding: 18px; }
.pk-foot { display: flex; justify-content: space-between; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--border); font-size: 11.5px; color: var(--faint); }
.pk-foot kbd { font-family: var(--mono); font-size: 10.5px; padding: 0 5px; border: 1px solid var(--border); border-radius: 5px; background: var(--surface-2); color: var(--muted); }

/* ------------------------------------------------------------------ responsive */
@media (max-width: 1280px) {
  .assistant { position: fixed; right: 0; top: 0; box-shadow: var(--shadow-lg); z-index: 50; }
  .backdrop.on { display: block; position: fixed; inset: 0; background: rgba(15,23,42,.35); z-index: 45; }
}
@media (max-width: 960px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar { position: fixed; left: 0; top: 0; width: 248px; transform: translateX(-100%); transition: transform .2s; box-shadow: var(--shadow-lg); z-index: 55; }
  .sidebar.open { transform: none; }
  .btn.menu-btn { display: inline-flex; }
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .metric:nth-child(4) { border-left: 0; } .metric:nth-child(n+4) { border-top: 1px solid var(--border); }
  .g-2, .g-3, .g-main, .g-chart, .hero, .how { grid-template-columns: minmax(0, 1fr); }
  .gsearch { display: none; }
  .ring { margin-top: 0; width: 80px; height: 80px; }
  .topbar { padding: 10px 16px; } .content { padding: 16px 16px 40px; }
  .assistant { width: 100%; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .stats div:nth-child(3) { border-left: 0; } .stats div:nth-child(n+3) { border-top: 1px solid var(--border); }
  .kv { grid-template-columns: 130px 1fr; }
  .weights div { grid-template-columns: 1fr 70px 34px; }
  .hide-sm { display: none !important; }
}
@media (max-width: 600px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .metric { border-left: 0 !important; border-top: 1px solid var(--border); }
  .profile { flex-wrap: wrap; } .p-nav { margin-left: 0; }
  .search input { width: 100%; } .search { flex: 1; }
  .picker, .pk-trigger { width: 100%; }
  .topbar h1 { font-size: 16px; }

<body>

<script>
"use strict";
// ---------------------------------------------------------------- icons (stroke icons, 24px grid)
const ICONS = {

  table: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/>',
  shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',

const ic = (n, cls = "") => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ""}</svg>`;

// ---------------------------------------------------------------- state
const VIEWS = [
  { key: "upload", label: "Upload data", icon: "upload", title: "Upload data", color: "var(--teal)" },
  { key: "dashboard", label: "Dashboard", icon: "grid", title: "Decision dashboard", needs: true, color: "var(--indigo)" },
  { key: "applications", label: "Applications", icon: "list", title: "Applications", needs: true, count: true, color: "var(--amber)" },
  { key: "applicant", label: "Applicant profile", icon: "user", title: "Applicant profile", needs: true, color: "var(--rose)" },
  { key: "method", label: "How decisions work", icon: "book", title: "How decisions work", color: "var(--sky)" },
];
const DECISIONS = ["Approved", "Waitlisted", "On hold", "Not approved"];
const DEC_ICON = { Approved: "check", Waitlisted: "clock", "On hold": "pause", "Not approved": "xcircle" };
const SEV = { blocking: ["block", "Blocking issue"], decision: ["flag", "Decision"], warning: ["alert", "Warning"], info: ["info", "Note"] };
let S = { view: "upload", session: null, original: null, result: null, summary: null, warnings: [], fileName: null,
          messages: [], changeLog: [], selected: null, filters: { dec: "", ter: "", q: "" }, sort: { key: "", dir: 1 },
          tab: "overview", assistant: window.innerWidth > 1280 };
let META = null, BUSY = false;

// ---------------------------------------------------------------- utilities
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (x, d = 1) => (x === null || x === undefined || x === "") ? "–" : (Math.abs(x - Math.round(x)) < 1e-9 ? String(Math.round(x)) : Number(x).toFixed(d));
const cls = (d) => String(d).replace(/\s+/g, "-");
const pill = (d, lg) => `<span class="pill ${lg ? "lg " : ""}p-${cls(d)}">${esc(d)}</span>`;
const initials = (n) => String(n || "?").trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join("").toUpperCase();
const hue = (s) => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const records = () => (S.result ? Object.values(S.result.records) : []);
function md(text) {
  const lines = esc(text).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").split("\n");
  let html = "", list = false;
  for (const l of lines) {
    if (/^\s*[-•] /.test(l)) { if (!list) { html += "<ul>"; list = true; } html += `<li>${l.replace(/^\s*[-•] /, "")}</li>`; }
    else { if (list) { html += "</ul>"; list = false; } if (l.trim()) html += `<p>${l}</p>`; }
  }
  return html + (list ? "</ul>" : "");
}
function save() { try { sessionStorage.setItem("fe_state_v2", JSON.stringify(S)); } catch (e) { /* storage full or blocked */ } }
function restore() { try { const s = JSON.parse(sessionStorage.getItem("fe_state_v2") || "null"); if (s) S = Object.assign(S, s); } catch (e) {} }
function toast(msg, err) { const t = $("toast"); t.textContent = msg; t.className = "toast on" + (err ? " err" : ""); clearTimeout(toast._t); toast._t = setTimeout(() => (t.className = "toast"), 4200); }
function busy(on) { BUSY = on; $("progress").classList.toggle("on", on); $("send").disabled = on; renderMsgs(); }
async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  if (!r.ok) { let m = r.statusText; try { const j = await r.json(); m = j.detail || m; } catch (e) {} throw new Error(m); }
  return r;
}
const postJSON = async (path, body) => (await api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })).json();
const useLLM = () => !!(META && META.llm_available);  // AI phrasing is used automatically when a key is configured
const sessionBody = (extra = {}) => Object.assign({}, S.session, { use_llm: useLLM() }, extra);
function go(view, extra = {}) { Object.assign(S, extra, { view }); closeSide(); render(); window.scrollTo(0, 0); }

// ---------------------------------------------------------------- data actions
function applyLoad(j) {
  S.session = j.session; S.original = JSON.parse(JSON.stringify(j.session)); S.result = j.result; S.summary = j.summary;
  S.warnings = j.warnings; S.fileName = j.file_name; S.messages = []; S.changeLog = []; S.selected = null;
  S.filters = { dec: "", ter: "", q: "" }; S.sort = { key: "", dir: 1 }; S.tab = "overview";
  S.view = j.summary.applications ? "dashboard" : "upload";
}
async function loadSample() {
  busy(true);
  try { applyLoad(await postJSON(`/api/sample?use_llm=${useLLM()}`, {})); toast("Sample data loaded: 27 applications decided."); }
  catch (e) { toast(e.message, true); }
  busy(false); render();
}
async function loadFile(f) {
  if (!f) return;
  busy(true);
  try {
    const fd = new FormData(); fd.append("file", f);
    applyLoad(await (await api(`/api/upload?use_llm=${useLLM()}`, { method: "POST", body: fd })).json());
    toast(`${S.summary.applications} applications decided from ${f.name}.`);
  } catch (e) { toast(e.message, true); }
  busy(false); render();
}
async function rerun() {
  if (!S.session) return;
  busy(true);
  try { const j = await postJSON("/api/run", sessionBody()); S.result = j.result; S.session.signals = j.signals; S.session.use_llm = j.use_llm; }
  catch (e) { toast(e.message, true); }
  busy(false); render();
}
async function resetToUpload() {
  if (!S.original || !S.changeLog.length) { toast("Nothing to reset: no chat updates yet."); return; }
  S.session = JSON.parse(JSON.stringify(S.original)); S.changeLog = [];
  S.messages.push({ role: "assistant", content: "Reset done: all chat updates were dropped and the decisions are back to the uploaded file." });
  await rerun();
}
async function downloadExport() {
  busy(true);
  try {
    const r = await api("/api/export", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(sessionBody({ change_log: S.changeLog })) });
    const blob = await r.blob(); const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `franchise_decisions_${S.result.run_date}.xlsx`; a.click(); URL.revokeObjectURL(a.href);
    toast("Results exported to Excel.");
  } catch (e) { toast(e.message, true); }
  busy(false);
}

// ---------------------------------------------------------------- assistant
async function send(text) {
  text = (text || "").trim(); if (!text || BUSY) return;
  openAssistant();
  S.messages.push({ role: "user", content: text });
  if (!S.result) { S.messages.push({ role: "assistant", content: "Upload a file or load the sample data first, then ask me about any applicant." }); render(); return; }
  busy(true);
  try {
    const j = await postJSON("/api/chat", sessionBody({ message: text }));
    S.messages.push({ role: "assistant", content: j.reply });
    if (j.result) {
      S.session.applications = j.applications; S.session.signals = j.signals; S.result = j.result;
      const affected = [...new Set([...(j.targets || []), ...(j.changes || []).map((c) => c.app_id)])];
      const changes = (j.changes || []).filter((c) => c.old !== c.new).map((c) => `${c.app_id}: ${c.old} → ${c.new}`);
      S.changeLog.push({ time: new Date().toLocaleTimeString(), message: text, parsed_by: j.parsed_by, updates: j.updates, affected, changes });
      toast(changes.length ? `Re-decided: ${changes.length} decision(s) changed.` : "Updated; no decisions changed.");
    }
  } catch (e) { S.messages.push({ role: "assistant", content: "Sorry, that request failed: " + e.message }); }
  busy(false); render();
}
function examplePrompts() {
  if (!S.result) return ["Why is APP-007 on hold?", "APP-012 has now found a ground-floor space"];
  const recs = records(), out = [];
  const hold = recs.find((r) => r.decision === "On hold"); if (hold) out.push(`Why is ${hold.app_id} on hold?`);
  for (const t of S.result.territories) {
    const ranked = recs.filter((r) => r.territory_id === t.territory_id && r.rank).sort((a, b) => a.rank - b.rank);
    const a = ranked.find((r) => r.decision === "Approved"), b = ranked.find((r) => r.decision === "Waitlisted");
    if (a && b) { out.push(`Why did ${a.app_id} beat ${b.app_id}?`, `Who is waitlisted in ${t.territory_id}?`); break; }
  }
  const upper = recs.find((r) => r.decision === "On hold" && r.reasons.some((x) => x.code === "FLOOR_UNSUITABLE"));
  if (upper) out.push(`${upper.app_id} has now found a ground-floor space`);
  const gap = recs.find((r) => r.reasons.some((x) => x.code === "FUNDING_GAP"));
  if (gap && gap.required_lakh) out.push(`${gap.app_id} can now invest ₹${Math.floor(gap.required_lakh) + 5} lakh`);
  const appr = recs.find((r) => r.decision === "Approved"); if (appr) out.push(`${appr.app_id} has withdrawn`);
  return out.slice(0, 6);
}
function renderMsgs() {
  const box = $("msgs");
  let h = "";
  if (!S.messages.length) {
    h = `<div class="welcome"><div class="as-ico">${ic("spark")}</div><b>Ask about any decision</b>
      <p>${S.result ? "Ask why, compare two applicants, or share new facts. Decisions re-run instantly and every knock-on change is listed." : "Load data first, then ask about any applicant."}</p></div>`;
  }
  h += S.messages.map((m) => `<div class="msg m-${m.role}">${md(m.content)}</div>`).join("");
  if (BUSY && S.messages.length && S.messages[S.messages.length - 1].role === "user") h += `<div class="msg m-assistant"><span class="typing"><i></i><i></i><i></i></span></div>`;
  box.innerHTML = h; box.scrollTop = box.scrollHeight;
  const sugg = examplePrompts(), compact = S.messages.length > 0;
  $("sugg").className = "sugg" + (compact ? " compact" : "");
  $("sugg").innerHTML = (compact ? "" : `<div class="sugg-title">Try asking</div>`) +
    (compact ? sugg.slice(0, 3) : sugg).map((p) => `<button data-prompt="${esc(p)}">${compact ? "" : ic("arrow")}${esc(p)}</button>`).join("");
}
function openAssistant() { S.assistant = true; syncAssistant(); }
function syncAssistant() {
  $("assistant").classList.toggle("closed", !S.assistant);
  $("backdrop").classList.toggle("on", S.assistant && window.innerWidth <= 1280);
}
function closeSide() { $("sidebar").classList.remove("open"); if (!S.assistant) $("backdrop").classList.remove("on"); }

// ---------------------------------------------------------------- shell
function renderShell() {
  const v = VIEWS.find((x) => x.key === S.view) || VIEWS[0];
  $("nav").innerHTML = `<div class="nav-label">Workspace</div>` + VIEWS.map((x) => {
    const dis = x.needs && !S.result;
    const count = x.count && S.result ? `<span class="count">${records().length}</span>` : "";
    return `<button class="${x.key === S.view ? "active" : ""}" style="--nc:${x.color}" data-view="${x.key}" ${dis ? "disabled" : ""}>${ic(x.icon)}${x.label}${count}</button>`;
  }).join("");
  $("crumbs").textContent = S.result ? `${S.fileName || "Dataset"} · run ${S.result.run_date}` : "No data loaded";
  $("title").textContent = S.view === "applicant" && S.result && S.result.records[S.selected] ? `${S.selected} · ${S.result.records[S.selected].name || ""}` : v.title;
  let a = S.result ? `<button class="btn sm" data-action="export" title="Download all decisions as Excel">${ic("download")}<span class="lbl">Export</span></button>` : "";
  a += `<button class="btn sm ${S.assistant ? "" : "primary"}" data-action="assistant" title="Ask why, or share new facts">${ic("spark")}<span class="lbl">Assistant</span></button>`;
  a += `<div class="me hide-sm"><div class="av">GT</div><div><b>Growth Team</b><span>Franchise expansion</span></div></div>`;
  $("top-actions").innerHTML = a;
  $("gsearch").style.visibility = S.result ? "visible" : "hidden";
  if (document.activeElement !== $("gq")) $("gq").value = S.filters.q || "";
}

// ---------------------------------------------------------------- views: upload
function viewUpload() {
  let h = `<div class="stack"><div class="card hero">
    <div><h2>Start a decision run</h2>
      <p>Upload the applications workbook in the case template format (Sheet 1 Applications, Sheet 2 Territories). The existing-stores list is fixed and bundled. Every applicant gets a decision, the reasons, next steps and, if approved, an onboarding plan.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn primary" data-action="sample">${ic("table")}Use sample data</button>
        <a class="btn" href="/api/sample-file" download>${ic("download")}Sample file</a>
        <a class="btn" href="/api/template" download>${ic("file")}Empty template</a>
      </div></div>
    <div class="drop" id="drop" role="button" tabindex="0"><div class="d-ico">${ic("upload")}</div><b>Drop your .xlsx file here</b><span>or click to browse · up to 10 MB</span></div>
  </div>`;
  if (S.summary) {
    const s = S.summary;
    h += `<div class="card"><div class="card-h">${ic("check")}<h3>${esc(S.fileName)}</h3><span class="sub">read successfully</span>

      <div class="stats"><div><b>${s.applications}</b><span>Applications</span></div><div><b>${s.territories}</b><span>Territories</span></div>
      <div><b>${s.stores}</b><span>Existing stores (${s.stores_source === "upload" ? "from file" : "bundled"})</span></div><div><b>${S.warnings.length}</b><span>Data warnings</span></div></div>`;

    if (S.warnings.length) {
      h += `<div class="table-wrap" style="border-top:1px solid var(--border)"><table><thead><tr><th>Sheet</th><th>Row</th><th>What we noticed</th></tr></thead><tbody>
        ${S.warnings.map((w) => `<tr><td>${esc(w.sheet || "–")}</td><td class="mono">${esc(w.row ?? "–")}</td><td class="wrap">${esc(w.message)}</td></tr>`).join("")}</tbody></table></div>`;
    }
    h += `</div>`;
  }
  h += `<div class="how">
    <div class="card"><div class="n">1</div><b>Read and check</b><p>Messy cells are cleaned, the location is checked against the pin code, and contradictions in the notes are flagged.</p></div>
    <div class="card"><div class="n">2</div><b>Decide with rules</b><p>Three gates, a 100-point score card and one store per pin code. Slots are allocated by rank within each territory.</p></div>
    <div class="card"><div class="n">3</div><b>Explain and onboard</b><p>Plain-language reasons, exact fixes for on-hold cases, and a dated checklist and training plan for every approval.</p></div>
  </div></div>`;
  return h;
}

// ---------------------------------------------------------------- views: dashboard
const DEC_VAR = { Approved: "var(--c-ok)", Waitlisted: "var(--c-wait)", "On hold": "var(--c-hold)", "Not approved": "var(--c-no)" };
function greeting() { const h = new Date().getHours(); return h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening"; }
function avatarHtml(name, id, size = 30) {
  return `<span class="mini-av" style="width:${size}px;height:${size}px;background:hsl(${hue(id)} 58% 48%)">${esc(initials(name))}</span>`;
}
// Stacked bars: applicants per territory, split by decision. 2px surface gap between segments, 4px rounded ends.
function territoryBars(R, recs) {
  const ters = R.territories.map((t) => t.territory_id);
  const rows = ters.map((tid) => { const c = {}; DECISIONS.forEach((d) => (c[d] = recs.filter((r) => r.territory_id === tid && r.decision === d).length)); return { tid, c, total: DECISIONS.reduce((a, d) => a + c[d], 0) }; });
  const max = Math.max(1, ...rows.map((r) => r.total));
  const step = max <= 5 ? 1 : max <= 10 ? 2 : 5, top = Math.ceil(max / step) * step;
  const W = Math.max(360, rows.length * 78), H = 230, pl = 28, pb = 34, pt = 8, ph = H - pb - pt, bw = 30;
  const slot = (W - pl) / Math.max(rows.length, 1);
  let g = "";
  for (let v = 0; v <= top; v += step) { const y = pt + ph - (v / top) * ph; g += `<line class="grid" x1="${pl}" x2="${W}" y1="${y}" y2="${y}"/><text x="${pl - 8}" y="${y + 4}" text-anchor="end">${v}</text>`; }
  rows.forEach((r, i) => {
    const x = pl + slot * i + (slot - bw) / 2; let y = pt + ph;
    DECISIONS.forEach((d) => {
      const n = r.c[d]; if (!n) return;
      const h = (n / top) * ph, gap = 2;
      y -= h;
      g += `<rect x="${x}" y="${y + gap / 2}" width="${bw}" height="${Math.max(h - gap, 2)}" rx="4" fill="${DEC_VAR[d]}" data-tip="${esc(r.tid)} · ${d}: ${n}" data-ter="${esc(r.tid)}"/>`;
    });
    g += `<text class="lbl" x="${x + bw / 2}" y="${H - 16}" text-anchor="middle">${esc(r.tid)}</text><text x="${x + bw / 2}" y="${H - 3}" text-anchor="middle">${r.total} total</text>`;
  });

}
// Half-circle gauge: approved stores vs open slots.
function slotGauge(filled, total) {
  const pct = total ? Math.min(1, filled / total) : 0, r = 80, cx = 100, cy = 96;
  const arc = (p) => { const a = Math.PI * (1 - p); return `${cx + r * Math.cos(a)} ${cy - r * Math.sin(a)}`; };
  const track = `M ${cx - r} ${cy} A ${r} ${r} 0 0 1 ${cx + r} ${cy}`;
  const val = pct > 0 ? `<path d="M ${cx - r} ${cy} A ${r} ${r} 0 0 1 ${arc(pct)}" stroke="url(#gg)" stroke-width="18" fill="none" stroke-linecap="round" data-tip="${filled} of ${total} slots filled"/>` : "";
  return `<div class="gauge"><svg class="chart" viewBox="0 0 200 110" role="img" aria-label="${filled} of ${total} open slots filled">
    <defs><linearGradient id="gg" x1="0" x2="1"><stop offset="0" stop-color="#14b8a6"/><stop offset=".55" stop-color="#6366f1"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs>
    <path d="${track}" stroke="var(--surface-3)" stroke-width="18" fill="none" stroke-linecap="round"/>${val}</svg>
    <div class="gauge-num"><b>${total ? Math.round(pct * 100) + "%" : "–"}</b><span>${filled} of ${total} slots filled</span></div></div>
    <div class="gauge-legend"><span><i style="background:linear-gradient(90deg,#14b8a6,#6366f1,#a855f7)"></i>Filled ${filled}</span><span><i style="background:var(--surface-3)"></i>Open ${Math.max(0, total - filled)}</span></div>`;
}
// Donut: decision mix, 2px gaps between arcs.
function decisionDonut(c, total) {
  const r = 54, C = 2 * Math.PI * r; let off = 0, segs = "";
  DECISIONS.forEach((d) => {
    if (!c[d]) return;
    const len = (c[d] / Math.max(total, 1)) * C, gap = DECISIONS.filter((x) => c[x]).length > 1 ? 2 : 0;
    segs += `<circle cx="74" cy="74" r="${r}" fill="none" stroke="${DEC_VAR[d]}" stroke-width="18" stroke-dasharray="${Math.max(len - gap, 0.1)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 74 74)" data-tip="${d}: ${c[d]} (${Math.round(100 * c[d] / Math.max(total, 1))}%)" data-filter="${d}"/>`;
    off += len;
  });
  return `<svg class="chart" viewBox="0 0 148 148" role="img" aria-label="Decision mix"><circle cx="74" cy="74" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="18"/>${segs}
    <text x="74" y="72" text-anchor="middle" style="font-size:26px;font-weight:700;fill:var(--text)">${total}</text><text x="74" y="91" text-anchor="middle">applications</text></svg>`;
}
function scoreRing(score) {
  const r = 38, C = 2 * Math.PI * r, p = score == null ? 0 : Math.max(0, Math.min(1, score / 100));
  return `<div class="ring"><svg viewBox="0 0 88 88" role="img" aria-label="Score ${score == null ? "not scored" : fmt(score) + " of 100"}">
    <defs><linearGradient id="rg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#14b8a6"/><stop offset=".5" stop-color="#6366f1"/><stop offset="1" stop-color="#d946ef"/></linearGradient></defs>
    <circle cx="44" cy="44" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="8"/>
    ${p ? `<circle cx="44" cy="44" r="${r}" fill="none" stroke="url(#rg)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C * p} ${C}" transform="rotate(-90 44 44)"/>` : ""}
    <text x="44" y="46" text-anchor="middle" style="font:700 20px var(--font);fill:var(--text)">${score == null ? "–" : fmt(score)}</text>
    <text x="44" y="61" text-anchor="middle" style="font:500 9.5px var(--font);fill:var(--muted)">${score == null ? "not scored" : "score / 100"}</text></svg></div>`;
}
